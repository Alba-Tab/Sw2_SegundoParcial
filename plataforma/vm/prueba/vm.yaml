# B12: la VM en la Mac, sin AWS. docker compose -f compose.yaml -f prueba/vm.yaml up -d --wait (ver README.md).
# Logs a docker en vez de CloudWatch; Viajes con las claves locales, DynamoDB Local y S3 local del compose local
# (puertos 8000 y 9000 de la Mac) y Keycloak por MAC_LOCAL, como el resto de los servicios.
x-logs: &logs-locales
  logging: !override { driver: json-file }

services:
  postgres: *logs-locales
  temporal: *logs-locales
  temporal-ui: *logs-locales
  rabbitmq: *logs-locales
  caddy: *logs-locales
  viajes:
    logging: !override { driver: json-file }
    extra_hosts: ["${MAC_LOCAL:-mac.local}:host-gateway", "host.docker.internal:host-gateway"]
    environment:
      GPS_DYNAMODB_ENDPOINT: http://host.docker.internal:8000
      S3_ENDPOINT: http://host.docker.internal:9000
      S3_ENDPOINT_PUBLICO: http://localhost:9000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local-secreto
    ports: ["8101:8101"]
