# AMQPS y MQTTS con el certificado de certificados.sh (B3). Los clientes no presentan certificado: entran con
# usuario y clave por servicio, y verifican al broker contra la CA propia.
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile = /certs/servidor.pem
ssl_options.keyfile = /certs/servidor.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
# MQTT solo con TLS (el simulador desde la Mac); el 1883 en claro queda apagado.
mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
