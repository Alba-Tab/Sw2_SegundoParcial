# La topología (rabbitmq/definitions.json) y los usuarios los carga iniciar/rabbitmq-usuarios.sh por la API.
# Importar las definiciones al arrancar impediría crear el administrador desde RABBITMQ_DEFAULT_USER.
# D30: el sensor publica por MQTT y Flota lo consume por AMQP desde amq.topic (MQTT usa "/" y AMQP ".").
mqtt.exchange = amq.topic
mqtt.allow_anonymous = false
