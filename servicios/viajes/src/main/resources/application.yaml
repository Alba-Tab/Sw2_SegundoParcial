# Todo lo que cambia entre local y nube viene del entorno (000 §11). Valores locales en .env.example.
spring:
  application.name: viajes
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viajes}
    username: ${DB_USUARIO:viajes}
    password: ${DB_CLAVE:viajes}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
  rabbitmq:
    host: ${AMQP_HOST:localhost}
    port: ${AMQP_PORT:5672}
    username: ${AMQP_USUARIO:viajes}
    password: ${AMQP_CLAVE:viajes}
    publisher-confirm-type: simple
    # viajes.eventos la declara la topología del compose (o la nube); si todavía no existe, el consumidor reintenta.
    listener.simple:
      missing-queues-fatal: false
      prefetch: 10
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8101}
  shutdown: graceful

seguridad:
  issuer: ${OIDC_ISSUER:}
  audiencia: viajes
  cors-origenes: ${CORS_ORIGENES:}

# Cuenta de servicio viajes en Keycloak (spec 001): escribe clienteId y asigna el rol cliente.
identidad:
  secreto: ${KC_SECRETO_VIAJES:}

# Temporal (contratos/temporal/programar-viaje.md). TEMPORAL_WORKER=false deja solo la API.
temporal:
  direccion: ${TEMPORAL_ADDRESS:localhost:7233}
  namespace: transporte
  worker.habilitado: ${TEMPORAL_WORKER:true}

# parametrosSaga (spec 003). Normal: PT24H, PT10M, 8. Demo (.env.demo): PT3M, PT2M, 4.
saga:
  espera-aprobacion: ${SAGA_ESPERA_APROBACION:PT24H}
  compensacion:
    schedule-to-close: ${SAGA_COMPENSACION_SCHEDULE_TO_CLOSE:PT10M}
    maximo-intentos: ${SAGA_COMPENSACION_MAXIMO_INTENTOS:8}

# Evidencias en S3 (spec 006). En local, RustFS: el servidor usa S3_ENDPOINT y las URL firmadas S3_ENDPOINT_PUBLICO.
almacen:
  endpoint: ${S3_ENDPOINT:}
  endpoint-publico: ${S3_ENDPOINT_PUBLICO:}
  bucket: ${S3_BUCKET:transporte-evidencias}
  region: ${AWS_REGION:us-east-1}

# plataforma/semilla copiada en la imagen; --semilla.cargar=true la carga y termina (D102).
semilla:
  dir: ${SEMILLA_DIR:/app/semilla}
  cargar: false

outbox:
  intervalo: PT1S
  lote: 100

logging:
  structured.format.console: ${FORMATO_LOG:bo.transporte.viajes.configuracion.FormatoLog}

# Trazas: las activa TrazasSiHayEndpoint cuando OTEL_EXPORTER_OTLP_ENDPOINT existe (000 §10). Solo trazas, sin métricas ni logs OTLP.
management:
  endpoints.web.exposure.include: health
  tracing.sampling.probability: 1.0
  otlp.metrics.export.enabled: false
  logging.export.otlp.enabled: false
