[alembic]
script_location = migraciones
prepend_sys_path = .
# La URL sale de DATABASE_URL (app.configuracion), no de este archivo.

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s %(message)s
