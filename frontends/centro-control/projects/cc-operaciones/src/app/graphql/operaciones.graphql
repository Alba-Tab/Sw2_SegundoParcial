fragment ViajeFila on Viaje {
  viajeId
  servicioId
  estado
  motivo
  placa
  choferNombre
  tipoCarga
  toneladas
  fechaViaje
  iniciadoEn
  ultimaPosicion {
    lat
    lng
  }
  ultimaPosicionEn
  cliente {
    clienteId
    razonSocial
  }
  ruta {
    rutaId
    nombre
    destino
    distanciaKm
  }
}

# D101 (complejidad máxima 1.000): una lista con `limite` cuenta limite × campos de cada fila, y Apollo agrega
# `__typename` a cada objeto. Las listas piden solo lo que muestran; `npm run complejidad` lo verifica.
# Lo que se ve en la tabla de viajes, sin fragmento (cada fragmento suma otro `__typename` por fila): 80 × 12 + 1 = 961.
query Viajes($estado: EstadoViaje) {
  viajes(estado: $estado, limite: 80) {
    viajeId
    placa
    estado
    choferNombre
    fechaViaje
    cliente {
      razonSocial
    }
    ruta {
      nombre
    }
  }
}

# El popup del mapa: 50 × 17 + 1 = 851 (el mismo valor por defecto que el esquema). `riesgo` solo a quien lo puede ver
# (Viaje.riesgo: gerente y despachador), para no generar un SIN_PERMISO por fila en cada sondeo.
query Mapa($verRiesgo: Boolean!) {
  viajesEnCurso(limite: 50) {
    viajeId
    placa
    ultimaPosicion {
      lat
      lng
    }
    cliente {
      razonSocial
    }
    ruta {
      nombre
    }
    riesgo @include(if: $verRiesgo) {
      probabilidad
      enRiesgo
    }
  }
}

# monto, riesgo y unidad tienen @roles: se piden solo al rol que los puede ver (ui-comun/dominio, ROLES_CAMPO).
query Viaje($id: ID!, $verMonto: Boolean!, $verRiesgo: Boolean!, $verUnidad: Boolean!) {
  viaje(id: $id) {
    ...ViajeFila
    monto @include(if: $verMonto)
    riesgo @include(if: $verRiesgo) {
      probabilidad
      umbral
      enRiesgo
      calculadaEn
      factores {
        nombre
        aporte
      }
    }
    unidad @include(if: $verUnidad) {
      unidadId
      placa
      estado
    }
    hitos(limite: 20) {
      hitoId
      tipo
      descripcion
      origen
      registradoEn
    }
    entrega {
      entregaId
      tipo
      registradaEn
      distanciaMetros
      dentroGeocerca
      conFirma
      razones
      nombreReceptor
      motivo
      decision
      decididaPor
    }
  }
}

query EntregasObservadas {
  entregasObservadas {
    ...ViajeFila
    entrega {
      registradaEn
      distanciaMetros
      razones
      conFirma
      nombreReceptor
    }
  }
}

query Intervenciones {
  intervenciones {
    ...ViajeFila
  }
}

# 80 × 10 + 1 más los clientes = 805. `monto` no se pide al despachador (Servicio.monto: gerente, administracion, comercial).
query Servicios($estado: EstadoServicio, $verMonto: Boolean!) {
  servicios(estado: $estado, limite: 80) {
    servicioId
    clienteId
    tipoCarga
    toneladas
    fechaViaje
    monto @include(if: $verMonto)
    placa
    choferNombre
    confirmacionCompleta
  }
  clientes {
    clienteId
    razonSocial
  }
}

query Acciones($estado: EstadoAccion) {
  accionesPropuestas(estado: $estado) {
    accionId
    tipo
    viajeId
    razonSocial
    mensaje
    estado
    misionId
    creadaEn
    decididaPor
    decididaEn
    motivoRechazo
    evidencia {
      fuente
      referencia
      resumen
    }
    viaje {
      placa
      estado
      ruta {
        nombre
        destino
      }
    }
  }
}

mutation AprobarEntrega($viajeId: ID!, $nota: String, $clave: ID!) {
  aprobarEntregaObservada(viajeId: $viajeId, nota: $nota, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation RechazarEntrega($viajeId: ID!, $motivo: String!, $clave: ID!) {
  rechazarEntregaObservada(viajeId: $viajeId, motivo: $motivo, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation ResolverIntervencion($viajeId: ID!, $opcion: OpcionIntervencion!, $nota: String, $clave: ID!) {
  resolverIntervencion(viajeId: $viajeId, opcion: $opcion, nota: $nota, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation CancelarServicio($servicioId: ID!, $motivo: String!, $clave: ID!) {
  cancelarServicio(servicioId: $servicioId, motivo: $motivo, claveIdempotencia: $clave) {
    servicioId
    estado
  }
}

mutation AprobarAccion($id: ID!, $mensaje: String!, $clave: ID!) {
  aprobarAccion(id: $id, mensaje: $mensaje, claveIdempotencia: $clave) {
    accionId
    estado
  }
}

mutation RechazarAccion($id: ID!, $motivo: String, $clave: ID!) {
  rechazarAccion(id: $id, motivo: $motivo, claveIdempotencia: $clave) {
    accionId
    estado
  }
}
