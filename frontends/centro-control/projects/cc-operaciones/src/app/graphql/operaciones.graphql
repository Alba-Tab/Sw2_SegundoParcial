fragment ViajeFila on Viaje {
  viajeId
  servicioId
  estado
  motivo
  placa
  choferNombre
  tipoCarga
  toneladas
  fechaViaje
  iniciadoEn
  ultimaPosicion {
    lat
    lng
  }
  ultimaPosicionEn
  cliente {
    clienteId
    razonSocial
  }
  ruta {
    rutaId
    nombre
    destino
    distanciaKm
  }
}

# D101 (complejidad máxima 1.000): una lista con `limite` cuenta limite × campos de cada fila, y Apollo agrega
# `__typename` a cada objeto. Las listas piden solo lo que muestran; `npm run complejidad` lo verifica.
# Lo que se ve en la tabla de viajes, sin fragmento (cada fragmento suma otro `__typename` por fila): 80 × 12 + 1 = 961.
query Viajes($estado: EstadoViaje) {
  viajes(estado: $estado, limite: 80) {
    viajeId
    placa
    estado
    choferNombre
    fechaViaje
    cliente {
      razonSocial
    }
    ruta {
      nombre
    }
  }
}

# El popup del mapa: 50 × 17 + 1 = 851 (el mismo valor por defecto que el esquema). `riesgo` solo a quien lo puede ver
# (Viaje.riesgo: gerente y despachador), para no generar un SIN_PERMISO por fila en cada sondeo.
query Mapa($verRiesgo: Boolean!) {
  viajesEnCurso(limite: 50) {
    viajeId
    placa
    ultimaPosicion {
      lat
      lng
    }
    cliente {
      razonSocial
    }
    ruta {
      nombre
    }
    riesgo @include(if: $verRiesgo) {
      probabilidad
      enRiesgo
    }
  }
}

# monto, riesgo y unidad tienen @roles: se piden solo al rol que los puede ver (ui-comun/dominio, ROLES_CAMPO).
query Viaje($id: ID!, $verMonto: Boolean!, $verRiesgo: Boolean!, $verUnidad: Boolean!) {
  viaje(id: $id) {
    ...ViajeFila
    monto @include(if: $verMonto)
    riesgo @include(if: $verRiesgo) {
      probabilidad
      umbral
      enRiesgo
      calculadaEn
      factores {
        nombre
        aporte
      }
    }
    unidad @include(if: $verUnidad) {
      unidadId
      placa
      estado
    }
    hitos(limite: 20) {
      hitoId
      tipo
      descripcion
      origen
      registradoEn
    }
    entrega {
      entregaId
      tipo
      registradaEn
      distanciaMetros
      dentroGeocerca
      conFirma
      razones
      nombreReceptor
      motivo
      decision
      decididaPor
    }
  }
}

query EntregasObservadas {
  entregasObservadas {
    ...ViajeFila
    entrega {
      registradaEn
      distanciaMetros
      razones
      conFirma
      nombreReceptor
    }
  }
}

query Intervenciones {
  intervenciones {
    ...ViajeFila
  }
}

# 80 × 12 + 1 = 961. `monto` no se pide al despachador (Servicio.monto: gerente, administracion, comercial). La razón
# social viene en cada servicio (E5-1: `clientes` es por páginas).
query Servicios($estado: EstadoServicio, $verMonto: Boolean!) {
  servicios(estado: $estado, limite: 80) {
    servicioId
    clienteId
    razonSocial
    estado
    tipoCarga
    toneladas
    fechaViaje
    monto @include(if: $verMonto)
    placa
    choferNombre
    confirmacionCompleta
  }
}

# G7. `lineaCredito` solo a quien la puede ver (gerente, administracion, comercial): el despachador no la pide.
# Las líneas de la página van a Finanzas en un lote (B5, hasta 100 por llamada). E5-1: de a 50, con «Cargar más» por
# `despuesDe`.
query Clientes($verCredito: Boolean!, $despuesDe: Cursor) {
  clientes(limite: 50, despuesDe: $despuesDe) {
    items {
      clienteId
      razonSocial
      nit
      correo
      canal
      lineaCredito @include(if: $verCredito) {
        limite
        disponible
        enMora
        suspendida
      }
    }
    siguienteCursor
  }
}

# B1: la ficha lee el cliente por id. 50 × 12 + 1 más cliente, rutas y línea = 570.
query Cliente($clienteId: ID!, $verCredito: Boolean!, $verMonto: Boolean!) {
  cliente(id: $clienteId) {
    ...ClienteFicha
  }
  lineaCredito(clienteId: $clienteId) @include(if: $verCredito) {
    limite
    reservado
    utilizado
    disponible
    enMora
    suspendida
  }
  servicios(clienteId: $clienteId, limite: 50) {
    servicioId
    viajeId
    estado
    rutaId
    tipoCarga
    toneladas
    fechaViaje
    monto @include(if: $verMonto)
    placa
    creadoEn
  }
  rutas {
    rutaId
    nombre
  }
}

fragment ClienteFicha on Cliente {
  clienteId
  razonSocial
  nit
  correo
  canal
}

# G7: comercial y gerente; Viajes valida como en el alta (spec 001) y publica ClienteActualizado.
mutation EditarCliente($clienteId: ID!, $input: ClienteEdicionInput!) {
  editarCliente(clienteId: $clienteId, input: $input) {
    ...ClienteFicha
  }
}

# G4. Activas e inactivas: la gestión también reactiva las inactivas.
query Rutas {
  rutas(incluirInactivas: true) {
    rutaId
    nombre
    origen
    destino
    distanciaKm
    activa
  }
}

fragment RutaFicha on Ruta {
  rutaId
  nombre
  origen
  destino
  distanciaKm
  activa
  radioMetros
  origenCoordenadas {
    lat
    lng
  }
  destinoCoordenadas {
    lat
    lng
  }
}

# B1: la ficha lee la ruta por id.
query Ruta($id: ID!) {
  ruta(id: $id) {
    ...RutaFicha
  }
}

# G4: gerente y despachador; Viajes publica RutaActualizada.
mutation CrearRuta($input: RutaInput!) {
  crearRuta(input: $input) {
    ...RutaFicha
  }
}

mutation EditarRuta($rutaId: ID!, $input: RutaInput!) {
  editarRuta(rutaId: $rutaId, input: $input) {
    ...RutaFicha
  }
}

query Acciones($estado: EstadoAccion) {
  accionesPropuestas(estado: $estado) {
    accionId
    tipo
    viajeId
    razonSocial
    mensaje
    estado
    misionId
    creadaEn
    decididaPor
    decididaEn
    motivoRechazo
    evidencia {
      fuente
      referencia
      resumen
    }
    viaje {
      placa
      estado
      ruta {
        nombre
        destino
      }
    }
  }
}

mutation AprobarEntrega($viajeId: ID!, $nota: String, $clave: ID!) {
  aprobarEntregaObservada(viajeId: $viajeId, nota: $nota, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation RechazarEntrega($viajeId: ID!, $motivo: String!, $clave: ID!) {
  rechazarEntregaObservada(viajeId: $viajeId, motivo: $motivo, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation ResolverIntervencion($viajeId: ID!, $opcion: OpcionIntervencion!, $nota: String, $clave: ID!) {
  resolverIntervencion(viajeId: $viajeId, opcion: $opcion, nota: $nota, claveIdempotencia: $clave) {
    viajeId
    estado
  }
}

mutation CancelarServicio($servicioId: ID!, $motivo: String!, $clave: ID!) {
  cancelarServicio(servicioId: $servicioId, motivo: $motivo, claveIdempotencia: $clave) {
    servicioId
    estado
  }
}

mutation AprobarAccion($id: ID!, $mensaje: String!, $clave: ID!) {
  aprobarAccion(id: $id, mensaje: $mensaje, claveIdempotencia: $clave) {
    accionId
    estado
  }
}

mutation RechazarAccion($id: ID!, $motivo: String, $clave: ID!) {
  rechazarAccion(id: $id, motivo: $motivo, claveIdempotencia: $clave) {
    accionId
    estado
  }
}
