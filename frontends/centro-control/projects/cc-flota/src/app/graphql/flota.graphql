query Unidades($tipo: TipoUnidad, $estado: EstadoUnidad) {
  unidades(tipo: $tipo, estado: $estado) {
    unidadId
    tipoUnidad
    placa
    tipoRemolque
    estado
    kilometraje
    kmDesdeUltimoMantenimiento
    documentos {
      tipo
      venceEl
    }
  }
}

query Unidad($id: ID!) {
  unidad(id: $id) {
    unidadId
    tipoUnidad
    placa
    tipoRemolque
    capacidadToneladas
    estado
    kilometraje
    kmDesdeUltimoMantenimiento
    documentos {
      tipo
      venceEl
    }
    atributos
  }
  mantenimientos(unidadId: $id) {
    mantenimientoId
    tipo
    estado
    fechaProgramada
    taller
    descripcion
    checklist {
      item
      ok
      nota
    }
    programadoEn
    cerradoEn
    observaciones
  }
}

# Todos los mantenimientos (G9): la lista filtra y ordena en el navegador.
query Mantenimientos {
  mantenimientos {
    mantenimientoId
    unidadId
    placa
    tipo
    estado
    fechaProgramada
    taller
    descripcion
    cerradoEn
  }
}

query Choferes {
  choferes {
    choferId
    nombre
    licenciaCategoria
    licenciaVenceEl
    activo
    disponible
  }
}

# No hay `chofer(id)` en el esquema: la ficha sale de la lista, con su puntaje de conducción y sus viajes.
query Chofer($choferId: ID!) {
  choferes {
    choferId
    nombre
    licenciaCategoria
    licenciaVenceEl
    activo
    disponible
  }
  puntajesConduccion(choferId: $choferId) {
    desde
    hasta
    choferes {
      choferId
      frenadas
      fatigas
      km
      puntaje
    }
    viajes {
      viajeId
      frenadas
      fatigas
      km
      puntaje
    }
  }
}

query Combustible($desde: Fecha!) {
  anomaliasCombustible(desde: $desde) {
    cargaId
    placa
    viajeId
    litros
    kmPorLitro
    puntaje
    registradaEn
  }
  cargasCombustible(limite: 50) {
    cargaId
    viajeId
    placa
    litros
    monto
    kilometraje
    registradaEn
  }
}

query Conduccion($desde: Fecha) {
  puntajesConduccion(desde: $desde) {
    desde
    hasta
    datosAl
    choferes {
      choferId
      nombre
      frenadas
      fatigas
      km
      puntaje
    }
    viajes {
      viajeId
      choferId
      nombre
      frenadas
      fatigas
      km
      puntaje
    }
  }
}

mutation ProgramarMantenimiento($input: MantenimientoInput!) {
  programarMantenimiento(input: $input) {
    mantenimientoId
    estado
  }
}

mutation CerrarMantenimiento($input: CierreMantenimientoInput!) {
  cerrarMantenimiento(input: $input) {
    mantenimientoId
    estado
  }
}
