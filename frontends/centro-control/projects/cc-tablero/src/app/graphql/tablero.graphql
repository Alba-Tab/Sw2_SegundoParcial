# Cada bloque se pide solo al rol que lo puede ver (tablero/domain/tablero.ts): un rol sin permiso no ve una tarjeta en
# blanco ni genera un SIN_PERMISO por fila en cada sondeo.
query Tablero(
  $periodo: Periodo!
  $verViajes: Boolean!
  $verRiesgo: Boolean!
  $verUnidades: Boolean!
  $verCobranza: Boolean!
  $verAlertas: Boolean!
) {
  tablero(periodo: $periodo) {
    periodo
    viajesEnCurso @include(if: $verViajes) {
      viajeId
      placa
      choferNombre
      cliente {
        razonSocial
      }
      ruta {
        nombre
      }
      riesgo @include(if: $verRiesgo) {
        probabilidad
        enRiesgo
      }
    }
    unidadesPorEstado @include(if: $verUnidades) {
      estado
      cantidad
    }
    cuentasPorCobrar @include(if: $verCobranza) {
      saldoTotal
      facturasPorVencer
      facturasVencidas
      proximas {
        facturaId
        numero
        razonSocial
        saldo
        venceEl
      }
    }
    alertasAbiertas @include(if: $verAlertas)
    datosAl @include(if: $verAlertas)
  }
}

query Catalogo {
  catalogoReportes {
    reporteId
    titulo
    descripcion
    roles
    maxDias
    parametros
  }
  clientes {
    clienteId
    razonSocial
  }
  rutas {
    rutaId
    nombre
  }
}

query Reporte($id: ReporteId!, $params: ReporteParams) {
  reporte(id: $id, params: $params) {
    reporteId
    titulo
    parametros
    columnas {
      clave
      titulo
      tipo
    }
    filas
    totales
    grafico
    datosAl
  }
}

mutation ExportarReporte($id: ReporteId!, $params: ReporteParams, $clave: ID!) {
  exportarReporte(id: $id, params: $params, claveIdempotencia: $clave) {
    url
    nombreArchivo
    expiraEn
  }
}

mutation Preguntar($texto: String!) {
  preguntar(texto: $texto) {
    tipo
    texto
    reporteId
    parametros
    exportable
    resultado {
      reporteId
      titulo
      parametros
      columnas {
        clave
        titulo
        tipo
      }
      filas
      totales
      grafico
      datosAl
    }
    opciones {
      etiqueta
      reporteId
      parametros
    }
  }
}

query Misiones {
  misionesAgente(limite: 20) {
    misionId
    estado
    origen
    disparadaPor
    iniciadaEn
    terminadaEn
    codigo
    traceId
    accionesCreadas
    conclusion
    pasos {
      numero
      herramienta
      argumentos
      resumen
      error
      ms
    }
  }
}

mutation DispararMision($clave: ID!) {
  dispararMision(claveIdempotencia: $clave) {
    misionId
  }
}
