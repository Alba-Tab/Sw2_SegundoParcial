components:
  messages:
    ClienteActualizado:
      name: ClienteActualizado
      title: ClienteActualizado v1
      summary: 'Copia del cliente para Finanzas y Analítica (alta y cambios; spec 001). El primero de un cliente crea su línea de crédito en Finanzas (D01).'
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './viajes/ClienteActualizado.v1.schema.json'
    RutaActualizada:
      name: RutaActualizada
      title: RutaActualizada v1
      summary: 'Copia de la ruta para Finanzas (tarifas) y Analítica (spec 002).'
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './viajes/RutaActualizada.v1.schema.json'
    ChoferActualizado:
      name: ChoferActualizado
      title: ChoferActualizado v1
      summary: 'Copia del chofer para Analítica (reportes por chofer).'
      contentType: application/json
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $ref: './flota/ChoferActualizado.v1.schema.json'
    ViajeConfirmado:
      name: ViajeConfirmado
      title: ViajeConfirmado v1
      summary: 'El viaje pasó el pivote de la saga (paso 4; spec 003). También dispara el push ''Viaje asignado'' al chofer (D45).'
      contentType: application/json
      payload:
