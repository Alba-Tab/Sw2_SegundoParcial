asyncapi: 3.1.0
info:
  title: Eventos del Sistema de Transporte de Carga
  version: 1.0.0
  description: |
    Catálogo de eventos v1 (000 §6). Todos se publican en el exchange `transporte.events` (topic, durable)
    con Outbox, y cada consumidor los lee de su propia cola quorum `<consumidor>.eventos` con Inbox
    (`id` del sobre como llave) y cola de fallidos `<consumidor>.eventos.dlq`. Colas y bindings en README.md.
defaultContentType: application/json
servers:
  local:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ del docker compose local.
  nube:
    host: '{ipElastica}.sslip.io:5671'
    protocol: amqps
    description: RabbitMQ en la EC2 de plataforma, con usuarios por servicio y TLS con la CA del proyecto.
    variables:
      ipElastica:
        description: IP elástica de la EC2 con guiones (por ejemplo 3-91-10-20).
  sensor:
    host: '{ipElastica}.sslip.io:8883'
    protocol: mqtts
    description: Plugin MQTT de RabbitMQ para el simulador de combustible (en local, mqtt en 1883).
    variables:
      ipElastica:
        description: IP elástica de la EC2 con guiones.
