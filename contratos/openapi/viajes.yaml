openapi: 3.0.3
info:
  title: API de Viajes
  version: 1.0.0
  description: |
    Núcleo de Viajes (Spring Boot, hexagonal): clientes, rutas, servicios (inicio de la saga), cancelación
    y las señales de la saga. Specs: 001, 002, 003, 004, 011 y 012. Convenciones: specs/000-convenciones.md.
    Con rol `cliente`, el `clienteId` sale del token y se ignora el del cuerpo o la consulta; con `comercial`,
    sale del cuerpo o la consulta.
servers:
  - url: http://localhost:8101
    description: Local
security:
  - bearer: []
tags:
  - name: salud
  - name: clientes
  - name: rutas
  - name: servicios
  - name: saga
  - name: viajes
  - name: evidencias
paths:
  /health:
    get:
      tags: [salud]
      operationId: salud
      summary: El proceso está vivo.
      security: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Salud'
  /health/ready:
    get:
      tags: [salud]
      operationId: saludLista
      summary: Las dependencias (PostgreSQL, Temporal, RabbitMQ) están listas. No depende de Keycloak (P10).
      security: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Salud'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

  /api/v1/clientes:
    post:
      tags: [clientes]
      operationId: crearCliente
      summary: Crea el cliente del usuario (alta desde el portal) o un cliente sin cuenta (rol comercial). Spec 001.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
        - $ref: './comun.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteNuevo'
      responses:
        '201':
          description: Cliente creado. `vinculado` dice si Keycloak ya tiene `clienteId` y el rol `cliente`.
          headers:
            Location:
              $ref: './comun.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '422':
          $ref: './comun.yaml#/components/responses/ReglaDeNegocio'
    get:
      tags: [clientes]
      operationId: listarClientes
      summary: Lista clientes para el selector del modo comercial (roles comercial, despachador, administracion, gerente).
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por razón social o NIT.
          schema:
            type: string
            maxLength: 120
        - $ref: './comun.yaml#/components/parameters/Limite'
        - $ref: './comun.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaClientes'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
  /api/v1/clientes/mio:
    get:
      tags: [clientes]
      operationId: obtenerMiCliente
      summary: El cliente del usuario del token (por su `sub`).
      responses:
        '200':
          description: Cliente del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
  /api/v1/clientes/mio/vinculacion:
    post:
      tags: [clientes]
      operationId: reintentarVinculacion
      summary: Repite solo la escritura de `clienteId` y del rol `cliente` en Keycloak. Spec 001.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Vinculación hecha; el portal debe renovar el token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/clientes/{clienteId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
    get:
      tags: [clientes]
      operationId: obtenerCliente
      summary: Un cliente. Con rol cliente, solo el propio.
      responses:
        '200':
          description: Cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/rutas:
    get:
      tags: [rutas]
      operationId: listarRutas
      summary: Rutas activas (cualquier usuario autenticado). Spec 002.
      responses:
        '200':
          description: Rutas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ruta'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
  /api/v1/rutas/{rutaId}:
    parameters:
      - name: rutaId
        in: path
        required: true
        schema:
          $ref: './comun.yaml#/components/schemas/Uuid'
    get:
      tags: [rutas]
      operationId: obtenerRuta
      summary: Una ruta.
      responses:
        '200':
          description: Ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/servicios:
    post:
      tags: [servicios]
      operationId: crearServicio
      summary: Confirma una cotización e inicia la saga ProgramarViaje. Spec 003.
      description: |
        Responde 202 al iniciar el workflow. Con la misma clave y el mismo cuerpo todavía EN_PROCESO, vuelve a
        llamar `start` con el mismo workflowId y responde otra vez 202 con el mismo servicioId (D43).
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
        - $ref: './comun.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioNuevo'
      responses:
        '202':
          description: Saga iniciada; consultar `Location` hasta que `estado` deje de ser PROGRAMANDO.
          headers:
            Location:
              $ref: './comun.yaml#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicioAceptado'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '422':
          $ref: './comun.yaml#/components/responses/ReglaDeNegocio'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
    get:
      tags: [servicios]
      operationId: listarServicios
      summary: Servicios del cliente del token; con comercial, despachador, administracion o gerente se puede filtrar por cliente y estado.
      parameters:
        - name: clienteId
          in: query
          required: false
          schema:
            $ref: './comun.yaml#/components/schemas/Uuid'
        - name: estado
          in: query
          required: false
          schema:
            $ref: './comun.yaml#/components/schemas/EstadoViaje'
        - $ref: './comun.yaml#/components/parameters/Limite'
        - $ref: './comun.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de servicios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServicios'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
  /api/v1/servicios/{servicioId}:
    parameters:
      - $ref: '#/components/parameters/ServicioId'
    get:
      tags: [servicios]
      operationId: obtenerServicio
      summary: Estado del servicio y su viaje; en PROGRAMANDO trae la etapa del workflow.
      responses:
        '200':
          description: Servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
  /api/v1/servicios/{servicioId}/cancelacion:
    parameters:
      - $ref: '#/components/parameters/ServicioId'
    post:
      tags: [servicios]
      operationId: cancelarServicio
      summary: Cancela un servicio CONFIRMADO con confirmacionCompleta (cliente propio, comercial o despachador). Spec 004.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancelacion'
      responses:
        '200':
          description: Servicio cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          description: '`CONFIRMACION_EN_CURSO`, `CANCELACION_NO_PERMITIDA` o `CONFLICTO_ESTADO`.'
          content:
            application/problem+json:
              schema:
                $ref: './comun.yaml#/components/schemas/Problema'
        '422':
          $ref: './comun.yaml#/components/responses/ReglaDeNegocio'
  /api/v1/servicios/{servicioId}/aprobacion-credito:
    parameters:
      - $ref: '#/components/parameters/ServicioId'
    post:
      tags: [saga]
      operationId: decidirAprobacionCredito
      summary: Envía la señal aprobacionCredito al workflow (solo administracion). Spec 012.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCredito'
      responses:
        '202':
          description: Señal entregada; el resultado se ve en obtenerServicio.
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/viajes/mios:
    get:
      tags: [viajes]
      operationId: listarMisViajes
      summary: Viajes del chofer del token (spec 005, D50); sin montos (D51).
      description: |
        Los viajes con `choferUsuarioSub = sub` en CONFIRMADO, EN_RUTA o ENTREGA_OBSERVADA, más los que terminaron en
        los últimos 7 días. La app los guarda en SQLite para operar sin señal.
      responses:
        '200':
          description: Viajes del chofer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaViajes'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
  /api/v1/viajes/{viajeId}:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
    get:
      tags: [viajes]
      operationId: obtenerViaje
      summary: Un viaje. El chofer solo ve los suyos; despachador, comercial, gerente, jefe_flota y agente_lectura, todos.
      responses:
        '200':
          description: Viaje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
  /api/v1/viajes/{viajeId}/inicio:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
    post:
      tags: [viajes]
      operationId: iniciarViaje
      summary: El chofer asignado registra el inicio (spec 005); CONFIRMADO → EN_RUTA y ViajeIniciado.
      description: |
        `Idempotency-Key` es el `opId` de la cola del celular. Con la confirmación de la saga todavía en curso responde
        409 CONFIRMACION_EN_CURSO y la app reintenta; un viaje cancelado responde 409 CONFLICTO_ESTADO.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioViaje'
      responses:
        '200':
          description: Viaje en ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viaje'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '422':
          $ref: './comun.yaml#/components/responses/ReglaDeNegocio'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/viajes/{viajeId}/evidencias:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
    post:
      tags: [evidencias]
      operationId: crearSubidaEvidencia
      summary: Abre la subida por partes de una foto o firma en S3 y devuelve las URL firmadas (spec 006, D40a).
      description: |
        Partes de 5 MB (la última puede ser menor), URL `PUT` firmadas de 15 min. La autoridad de idempotencia es el
        `evidenciaId` (como la llave de DynamoDB en los lotes de GPS): repetir con el mismo id y los mismos datos devuelve
        la subida con URL nuevas; con otros datos, 422 IDEMPOTENCIA_CUERPO_DISTINTO.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenciaNueva'
      responses:
        '201':
          description: Subida abierta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubidaEvidencia'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '422':
          $ref: './comun.yaml#/components/responses/ReglaDeNegocio'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/viajes/{viajeId}/evidencias/{evidenciaId}:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
      - $ref: '#/components/parameters/EvidenciaId'
    get:
      tags: [evidencias]
      operationId: obtenerEvidencia
      summary: La evidencia con una URL `GET` firmada de 5 min si está COMPLETA.
      description: |
        Chofer propio, despachador, comercial y gerente; el cliente de ese viaje solo FOTO_ENTREGA, FIRMA y FOTO_RECHAZO;
        jefe_flota solo RECIBO_COMBUSTIBLE.
      responses:
        '200':
          description: Evidencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
  /api/v1/viajes/{viajeId}/evidencias/{evidenciaId}/partes:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
      - $ref: '#/components/parameters/EvidenciaId'
    get:
      tags: [evidencias]
      operationId: listarPartesEvidencia
      summary: Las partes ya subidas (ListParts) y URL nuevas para las que faltan.
      responses:
        '200':
          description: Estado de la subida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubidaEvidencia'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/viajes/{viajeId}/evidencias/{evidenciaId}/completar:
    parameters:
      - $ref: '#/components/parameters/ViajeId'
      - $ref: '#/components/parameters/EvidenciaId'
    post:
      tags: [evidencias]
      operationId: completarSubidaEvidencia
      summary: Completa la subida por partes, verifica el tamaño y deja la evidencia COMPLETA.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletarEvidencia'
      responses:
        '200':
          description: Evidencia completa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'
  /api/v1/viajes/{viajeId}/intervencion:
    parameters:
      - name: viajeId
        in: path
        required: true
        schema:
          $ref: './comun.yaml#/components/schemas/Uuid'
    post:
      tags: [saga]
      operationId: resolverIntervencion
      summary: Envía la señal resolverIntervencion (solo despachador). Spec 011.
      parameters:
        - $ref: './comun.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Intervencion'
      responses:
        '202':
          description: Señal entregada.
        '400':
          $ref: './comun.yaml#/components/responses/Validacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
        '503':
          $ref: './comun.yaml#/components/responses/NoDisponible'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Keycloak con audiencia `viajes`.
  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema:
        $ref: './comun.yaml#/components/schemas/Uuid'
    ServicioId:
      name: servicioId
      in: path
      required: true
      schema:
        $ref: './comun.yaml#/components/schemas/Uuid'
    ViajeId:
      name: viajeId
      in: path
      required: true
      schema:
        $ref: './comun.yaml#/components/schemas/Uuid'
    EvidenciaId:
      name: evidenciaId
      in: path
      required: true
      schema:
        $ref: './comun.yaml#/components/schemas/Uuid'
  schemas:
    ClienteNuevo:
      type: object
      required: [razonSocial, nit, correo, telefono, direccion]
      additionalProperties: false
      properties:
        razonSocial:
          type: string
          minLength: 3
          maxLength: 120
        nit:
          type: string
          pattern: '^[0-9]{5,20}$'
        correo:
          type: string
          format: email
          description: Correo de facturación; a él se envían los avisos.
        telefono:
          type: string
          minLength: 6
          maxLength: 20
        direccion:
          type: string
          minLength: 3
          maxLength: 200
    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteNuevo'
        - type: object
          required: [clienteId, canal, tieneCuenta, vinculado, creadoEn]
          properties:
            clienteId:
              $ref: './comun.yaml#/components/schemas/Uuid'
            canal:
              $ref: './comun.yaml#/components/schemas/CanalServicio'
            tieneCuenta:
              type: boolean
            vinculado:
              type: boolean
              description: Keycloak ya tiene `clienteId` y el rol `cliente`. Siempre false si tieneCuenta es false.
            creadoPor:
              $ref: './comun.yaml#/components/schemas/Sub'
            creadoEn:
              $ref: './comun.yaml#/components/schemas/Instante'
    PaginaClientes:
      type: object
      required: [items, siguienteCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cliente'
        siguienteCursor:
          type: string
          nullable: true
    Lugar:
      type: object
      required: [nombre, coordenadas]
      properties:
        nombre:
          type: string
        coordenadas:
          $ref: './comun.yaml#/components/schemas/Coordenadas'
    Ruta:
      type: object
      required: [rutaId, nombre, origen, destino, distanciaKm, activa]
      properties:
        rutaId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        nombre:
          type: string
          example: Santa Cruz – La Paz
        origen:
          $ref: '#/components/schemas/Lugar'
        destino:
          allOf:
            - $ref: '#/components/schemas/Lugar'
            - type: object
              required: [radioMetros]
              properties:
                radioMetros:
                  type: integer
                  minimum: 50
                  maximum: 5000
                  description: Radio de la geocerca (D06).
        distanciaKm:
          type: number
          minimum: 0
          exclusiveMinimum: true
        activa:
          type: boolean
    InicioViaje:
      type: object
      description: '`iniciadoEn` es el reloj del celular al pulsar "Iniciar viaje"; como máximo 2 min en el futuro.'
      required: [dispositivoId, iniciadoEn]
      additionalProperties: false
      properties:
        dispositivoId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        iniciadoEn:
          $ref: './comun.yaml#/components/schemas/Instante'
        posicion:
          $ref: './comun.yaml#/components/schemas/Coordenadas'
    Viaje:
      type: object
      description: La operación, sin montos (D51).
      required: [viajeId, servicioId, estado, cliente, ruta, tipoCarga, toneladas, fechaViaje, placa, choferNombre]
      properties:
        viajeId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        servicioId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        estado:
          $ref: './comun.yaml#/components/schemas/EstadoViaje'
        motivo:
          type: string
          description: Código de 000 §5 cuando el viaje terminó CANCELADO.
        cliente:
          type: object
          required: [clienteId, razonSocial]
          properties:
            clienteId:
              $ref: './comun.yaml#/components/schemas/Uuid'
            razonSocial:
              type: string
        ruta:
          $ref: '#/components/schemas/Ruta'
        tipoCarga:
          $ref: './comun.yaml#/components/schemas/TipoCarga'
        toneladas:
          $ref: './comun.yaml#/components/schemas/Toneladas'
        fechaViaje:
          $ref: './comun.yaml#/components/schemas/Fecha'
        placa:
          $ref: './comun.yaml#/components/schemas/Placa'
        choferNombre:
          type: string
        iniciadoEn:
          $ref: './comun.yaml#/components/schemas/Instante'
    ListaViajes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Viaje'
    TipoEvidencia:
      type: string
      enum: [FOTO_ENTREGA, FIRMA, FOTO_RECHAZO, RECIBO_COMBUSTIBLE]
    EvidenciaNueva:
      type: object
      required: [evidenciaId, tipo, contentType, tamanoBytes]
      additionalProperties: false
      properties:
        evidenciaId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        contentType:
          type: string
          enum: [image/jpeg, image/png]
        tamanoBytes:
          type: integer
          minimum: 1
          maximum: 15728640
          description: Máximo 15 MB (D66).
    ParteFirmada:
      type: object
      required: [numero, url, expiraEn]
      properties:
        numero:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
        expiraEn:
          $ref: './comun.yaml#/components/schemas/Instante'
    ParteSubida:
      type: object
      required: [numero, etag]
      additionalProperties: false
      properties:
        numero:
          type: integer
          minimum: 1
        etag:
          type: string
          minLength: 1
          maxLength: 200
    SubidaEvidencia:
      type: object
      required: [evidenciaId, estado, tamanoParteBytes, partes, subidas]
      properties:
        evidenciaId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        estado:
          type: string
          enum: [SUBIENDO, COMPLETA]
        tamanoParteBytes:
          type: integer
          example: 5242880
        partes:
          type: array
          description: URL firmadas para las partes que faltan.
          items:
            $ref: '#/components/schemas/ParteFirmada'
        subidas:
          type: array
          description: Partes que S3 ya tiene (ListParts).
          items:
            $ref: '#/components/schemas/ParteSubida'
    CompletarEvidencia:
      type: object
      required: [partes]
      additionalProperties: false
      properties:
        partes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ParteSubida'
    Evidencia:
      type: object
      required: [evidenciaId, viajeId, tipo, estado, contentType, tamanoBytes]
      properties:
        evidenciaId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        viajeId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        estado:
          type: string
          enum: [SUBIENDO, COMPLETA]
        contentType:
          type: string
        tamanoBytes:
          type: integer
        url:
          type: string
          format: uri
          description: URL `GET` firmada de 5 min; solo si está COMPLETA.
        expiraEn:
          $ref: './comun.yaml#/components/schemas/Instante'
    ServicioNuevo:
      type: object
      required: [cotizacionId]
      additionalProperties: false
      properties:
        cotizacionId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        clienteId:
          $ref: './comun.yaml#/components/schemas/Uuid'
      description: '`clienteId` es obligatorio con rol comercial y se ignora con rol cliente.'
    ServicioAceptado:
      type: object
      required: [servicioId, viajeId, estado]
      properties:
        servicioId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        viajeId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        estado:
          type: string
          enum: [PROGRAMANDO]
    Servicio:
      type: object
      required: [servicioId, viajeId, clienteId, cotizacionId, canal, estado, confirmacionCompleta, creadoEn]
      properties:
        servicioId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        viajeId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        clienteId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        cotizacionId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        canal:
          $ref: './comun.yaml#/components/schemas/CanalServicio'
        creadoPor:
          $ref: './comun.yaml#/components/schemas/Sub'
        estado:
          $ref: './comun.yaml#/components/schemas/EstadoViaje'
        etapa:
          type: string
          enum: [INICIANDO, VALIDANDO_CREDITO, ESPERANDO_APROBACION, RESERVANDO_UNIDAD, CONFIRMANDO, COMPENSANDO, DESCONOCIDA]
          description: Solo mientras estado es PROGRAMANDO (consulta `estado` del workflow).
        motivo:
          type: string
          description: Código de 000 §5 cuando el servicio terminó CANCELADO (por ejemplo SIN_UNIDAD_COMPATIBLE).
        confirmacionCompleta:
          type: boolean
        rutaId:
          $ref: './comun.yaml#/components/schemas/Uuid'
        tipoCarga:
          $ref: './comun.yaml#/components/schemas/TipoCarga'
        toneladas:
          $ref: './comun.yaml#/components/schemas/Toneladas'
        fechaViaje:
          $ref: './comun.yaml#/components/schemas/Fecha'
        monto:
          $ref: './comun.yaml#/components/schemas/Monto'
        placa:
          $ref: './comun.yaml#/components/schemas/Placa'
        choferNombre:
          type: string
        ultimaPosicion:
          $ref: './comun.yaml#/components/schemas/Coordenadas'
        iniciadoEn:
          $ref: './comun.yaml#/components/schemas/Instante'
        creadoEn:
          $ref: './comun.yaml#/components/schemas/Instante'
    PaginaServicios:
      type: object
      required: [items, siguienteCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
        siguienteCursor:
          type: string
          nullable: true
    Cancelacion:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 300
    DecisionCredito:
      type: object
      required: [aprobado]
      additionalProperties: false
      properties:
        aprobado:
          type: boolean
        motivo:
          type: string
          minLength: 3
          maxLength: 300
          description: Obligatorio si aprobado es false.
    Intervencion:
      type: object
      required: [opcion]
      additionalProperties: false
      properties:
        opcion:
          type: string
          enum: [REINTENTAR_COMPENSACION, MARCAR_RESUELTO]
        nota:
          type: string
          minLength: 3
          maxLength: 500
          description: Obligatoria con MARCAR_RESUELTO.
